name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          working-directory: bot
          enable-cache: true
          cache-dependency-glob: bot/uv.lock

      - name: Unit tests
        working-directory: bot
        run: uv run --frozen pytest -q

      - name: Compose file is valid
        env:
          SECRET_KEY_BASE: ci-only
          POSTGRES_PASSWORD: ci-only
          REDIS_PASSWORD: ci-only
          BOT_WEBHOOK_SECRET: ci-only
        run: docker compose config --quiet
